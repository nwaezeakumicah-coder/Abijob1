name: Prepare Next.js 16.4.6 lockfiles

on:
  push:
    branches: [chore/upgrade-next-16-4-6]

permissions:
  contents: write

jobs:
  update-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Update root lockfile
        run: npm install next@16.4.6 --save-exact --no-audit --no-fund

      - name: Update admin portal lockfile
        working-directory: admin-portal
        run: npm install next@16.4.6 --save-exact --no-audit --no-fund

      - name: Commit updated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json admin-portal/package.json admin-portal/package-lock.json
          git commit -m "chore: update Next.js lockfiles to 16.4.6"
          git push origin HEAD:chore/upgrade-next-16-4-6
