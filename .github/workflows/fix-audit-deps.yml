name: Fix non-breaking npm audit advisories

on:
  push:
    branches: [chore/upgrade-next-16-4-6]

permissions:
  contents: write

jobs:
  update-audit-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Apply non-breaking dependency fixes
        run: npm audit fix --no-fund

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: fix non-breaking npm audit advisories"
          git push origin HEAD:chore/upgrade-next-16-4-6
