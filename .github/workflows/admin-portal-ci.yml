name: Admin Portal CI

on:
  pull_request:
    paths:
      - "admin-portal/**"
      - "scripts/**"
      - ".github/workflows/admin-portal-ci.yml"
  push:
    branches: [SIRMIC, "fix/**", "perf/**"]
    paths:
      - "admin-portal/**"
      - ".github/workflows/admin-portal-ci.yml"

permissions:
  contents: read

jobs:
  verify-admin-portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-portal
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check CSS accessibility
        run: node ../scripts/check-css-accessibility.mjs

      - name: Report dependency audit findings
        run: |
          npm audit --json > /tmp/admin-npm-audit.json || true
          node --input-type=module -e 'import fs from "node:fs"; const report = JSON.parse(fs.readFileSync("/tmp/admin-npm-audit.json", "utf8")); for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) console.log(`${name}: ${item.severity}; range=${item.range}; fixAvailable=${JSON.stringify(item.fixAvailable)}`);'

      - name: Type-check admin portal
        run: npx tsc --noEmit

      - name: Build admin portal
        # Placeholder public values let Next prerender the login shell in CI.
        # Real Supabase credentials remain environment-specific and are never stored here.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build
